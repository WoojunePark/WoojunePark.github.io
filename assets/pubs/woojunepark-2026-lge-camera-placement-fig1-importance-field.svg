<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="640" height="560" role="img" aria-labelledby="importance-field-title importance-field-desc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700"><title id="importance-field-title">Importance field for camera placement</title><desc id="importance-field-desc">Image gradients, depth edges, SAM3 segmentation and OCR are lifted into a 3D importance field that drives camera selection for Gaussian Splatting.</desc><rect width="320" height="280" fill="#fff"/><path d="M78 115V143" stroke="#0b0b0c" stroke-width="2"/><path d="M72 136l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M242 115V143" stroke="#0b0b0c" stroke-width="2"/><path d="M236 136l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><rect x="1" y="1" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="78.0" y="25.9" text-anchor="middle" fill="#0b0b0c">Image</text><text x="78.0" y="44.9" text-anchor="middle" fill="#0b0b0c">gradients</text><rect x="165" y="1" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="242.0" y="25.9" text-anchor="middle" fill="#0b0b0c">Depth</text><text x="242.0" y="44.9" text-anchor="middle" fill="#0b0b0c">edges</text><rect x="1" y="57" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="78.0" y="81.9" text-anchor="middle" fill="#0b0b0c">SAM3</text><text x="78.0" y="100.9" text-anchor="middle" fill="#0b0b0c">segmentation</text><rect x="165" y="57" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="242.0" y="91.4" text-anchor="middle" fill="#0b0b0c">OCR</text><rect x="1" y="145" width="318" height="58" fill="#0b0b0c"/><text x="160.0" y="179.4" text-anchor="middle" fill="#fff">3D importance field</text><path d="M160 203V233" stroke="#d81e15" stroke-width="3"/><path d="M154 226l6 8 6-8" fill="none" stroke="#d81e15" stroke-width="3"/><rect x="1" y="235" width="318" height="44" fill="#d81e15"/><text x="160.0" y="262.4" text-anchor="middle" fill="#fff">Camera selection</text></svg>
