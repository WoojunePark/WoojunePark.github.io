<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 261" width="640" height="522" role="img" aria-labelledby="camera-calibration-title camera-calibration-desc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700"><title id="camera-calibration-title">Target-less head camera calibration</title><desc id="camera-calibration-desc">SAM2 arm segmentation and forward-kinematics pose initialization feed an optimization of distortion and pose parameters against the robot's 3D model, which lowers projection error.</desc><rect width="320" height="261" fill="#fff"/><path d="M78 59V87" stroke="#0b0b0c" stroke-width="2"/><path d="M72 80l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M242 59V87" stroke="#0b0b0c" stroke-width="2"/><path d="M236 80l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><rect x="1" y="1" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="78.0" y="25.9" text-anchor="middle" fill="#0b0b0c">SAM2 arm</text><text x="78.0" y="44.9" text-anchor="middle" fill="#0b0b0c">segmentation</text><rect x="165" y="1" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="242.0" y="25.9" text-anchor="middle" fill="#0b0b0c">Forward-kinematics</text><text x="242.0" y="44.9" text-anchor="middle" fill="#0b0b0c">pose initialization</text><rect x="1" y="89" width="318" height="77" fill="#0b0b0c"/><text x="160.0" y="113.9" text-anchor="middle" fill="#fff">Optimize 5 distortion and</text><text x="160.0" y="132.9" text-anchor="middle" fill="#fff">6 pose parameters</text><text x="160.0" y="151.9" text-anchor="middle" fill="#fff">against the robot's 3D model</text><path d="M160 166V196" stroke="#d81e15" stroke-width="3"/><path d="M154 189l6 8 6-8" fill="none" stroke="#d81e15" stroke-width="3"/><rect x="1" y="198" width="318" height="62" fill="#d81e15"/><text x="160.0" y="224.9" text-anchor="middle" fill="#fff">Projection error</text><text x="160.0" y="243.9" text-anchor="middle" fill="#fff">over 20 px → under 5 px</text></svg>
