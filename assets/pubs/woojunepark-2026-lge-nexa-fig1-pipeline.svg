<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 316" width="640" height="632" role="img" aria-labelledby="nexa-pipeline-title nexa-pipeline-desc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700"><title id="nexa-pipeline-title">NEXA pipeline</title><desc id="nexa-pipeline-desc">A product design scene goes through the NEXA ONE 3ds Max plugin, which exports exact camera poses and 3D points as Gaussian Splatting training data without structure-from-motion.</desc><rect width="320" height="316" fill="#fff"/><path d="M160 45V73" stroke="#0b0b0c" stroke-width="2"/><path d="M154 66l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><rect x="1" y="1" width="318" height="44" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="160.0" y="28.4" text-anchor="middle" fill="#0b0b0c">Product design scene</text><rect x="1" y="75" width="204" height="58" fill="#0b0b0c"/><text x="103.0" y="99.9" text-anchor="middle" fill="#fff">NEXA ONE</text><text x="103.0" y="118.9" text-anchor="middle" fill="#fff">3ds Max plugin</text><rect x="217" y="75" width="102" height="58" fill="none" stroke="#5c6066" stroke-width="2" stroke-dasharray="5,4"/><text x="268.0" y="109.4" text-anchor="middle" fill="#5c6066">no SfM</text><path d="M78 133V161" stroke="#0b0b0c" stroke-width="2"/><path d="M72 154l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M242 148V161" stroke="#0b0b0c" stroke-width="2"/><path d="M236 154l6 8 6-8" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M150 133v15h93" fill="none" stroke="#0b0b0c" stroke-width="2"/><rect x="1" y="163" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="78.0" y="187.9" text-anchor="middle" fill="#0b0b0c">Exact camera</text><text x="78.0" y="206.9" text-anchor="middle" fill="#0b0b0c">poses</text><rect x="165" y="163" width="154" height="58" fill="none" stroke="#0b0b0c" stroke-width="2"/><text x="242.0" y="197.4" text-anchor="middle" fill="#0b0b0c">3D points</text><path d="M78 221V251" stroke="#d81e15" stroke-width="3"/><path d="M72 244l6 8 6-8" fill="none" stroke="#d81e15" stroke-width="3"/><path d="M242 221V251" stroke="#d81e15" stroke-width="3"/><path d="M236 244l6 8 6-8" fill="none" stroke="#d81e15" stroke-width="3"/><rect x="1" y="253" width="318" height="62" fill="#d81e15"/><text x="160.0" y="279.9" text-anchor="middle" fill="#fff">3D Gaussian Splatting</text><text x="160.0" y="298.9" text-anchor="middle" fill="#fff">training data, COLMAP format</text></svg>
