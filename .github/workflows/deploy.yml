name: Build and deploy

# data/cv.json is pushed here by the private career wiki (final-offer, workflow publish-cv-site.yml).
# Every push renders the HTML pages and the dated PDF CV, then deploys to GitHub Pages.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.data.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: data
        name: Data present?
        run: |
          if [ -f data/cv.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no data/cv.json yet; skipping"; fi
      - if: steps.data.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.data.outputs.ready == 'true'
        name: Korean fonts for the PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - if: steps.data.outputs.ready == 'true'
        name: Build site and PDF
        env:
          CHROME: /usr/bin/google-chrome
        run: python build.py --pdf
      - if: steps.data.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.data.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
